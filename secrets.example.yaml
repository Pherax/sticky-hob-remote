# Copy to secrets.yaml (never commit secrets.yaml).
iot_wifi_ssid: "YOUR_WIFI"
iot_wifi_password: "YOUR_WIFI_PASSWORD"
# 32-byte base64 key for Home Assistant pairing: generate with `openssl rand -base64 32`
sticky_api_key: "REPLACE_WITH_32_BYTE_BASE64_KEY"
sticky_ota_password: "CHOOSE_AN_OTA_PASSWORD"
# Same value as sticky_push_key in the hob's secrets.yaml. Any long random string.
sticky_push_key: "REPLACE_WITH_A_LONG_RANDOM_STRING"
